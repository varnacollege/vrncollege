<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Колеж по Предприемачество</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b5cceb;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .stage picture,
    .stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
    }
    .cta {
      position: absolute;
      left: 38.8%;
      top: 58%;
      transform: translateY(-50%);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20.5%;
      padding: 0.85rem 1rem;
      background: #ffd400;
      color: #1a1a1a;
      font: 700 clamp(0.8rem, 1.2vw, 0.95rem)/1.2 system-ui, sans-serif;
      text-decoration: none;
      border-radius: 0.3rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }
    .cta:hover {
      background: #ffe34d;
    }

    @media (max-width: 768px) {
      .stage {
        overflow: hidden;
      }
      .stage img {
        transform: scale(1.08);
        transform-origin: center center;
      }
      .cta {
        left: 33.8%;
        top: 53.5%;
        width: 29.5%;
        padding: 0.35rem 0.4rem;
        font-size: clamp(0.55rem, 2.2vw, 0.75rem);
        border-radius: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <picture>
      <source
        media="(max-width: 768px)"
        srcset="Gemini_Generated_Image_8z5ver8z5ver8z5v.png"
        width="1536"
        height="2752"
      />
      <img
        src="geralt-network-updated.jpg"
        alt=""
        width="1920"
        height="1280"
      />
    </picture>
    <a class="cta" href="https://varnacollege.com" target="_blank" rel="noopener noreferrer">Към сайта на Колежа →</a>
  </div>
</body>
</html>
